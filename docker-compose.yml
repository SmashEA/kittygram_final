volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend/
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      exec gunicorn --bind 0.0.0.0:8000 kittygram_backend.wsgi:application"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/static
      - media:/app/media
  frontend:
    build: ./frontend/
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
  gateway:
    build: ./nginx/
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9000:80"
    volumes:
      - static:/static:ro
      - media:/media:ro
